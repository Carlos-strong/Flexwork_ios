# Production sur un VPS unique : Postgres + migrations + web + worker + Caddy.
# Lancement : voir deploy/README.md. Variables : .env.production (modèle deploy/env.production.example).
#
# Seul Caddy publie des ports. Le web n'est joignable QUE par lui : c'est la condition du
# rate-limit par IP (DEPLOYMENT-PRODUCTION.md §1) — Caddy remplace X-Forwarded-For / X-Real-IP
# par l'adresse réelle du client.

x-app: &app
  build:
    context: .
    args:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
      NEXT_PUBLIC_ACADEMY_URL: ${NEXT_PUBLIC_ACADEMY_URL:-}
  image: flexwork:latest
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    QUEUE_MODE: worker
    STORAGE_DRIVER: local
    STORAGE_LOCAL_PATH: /app/storage
  volumes:
    - storage:/app/storage
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Une passe, avant le web et le worker (DEPLOYMENT-PRODUCTION.md §7, étape 2).
  migrate:
    <<: *app
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  web:
    <<: *app
    command: npm run start
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  worker:
    <<: *app
    command: npm run worker
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
