import useSWR from 'swr'

export function useTaxonomy() {
  const { data, error, isLoading } = useSWR(
    '/api/frontend/taxonomy',
    async (url: string) => {
      const cached = localStorage.getItem('taxonomy-etag')
      const res = await fetch(url, {
        headers: cached ? { 'If-None-Match': cached } : {}
      })
      if (res.status === 304) {
        return JSON.parse(localStorage.getItem('taxonomy-data')!)
      }
      const json = await res.json()
      localStorage.setItem('taxonomy-data', JSON.stringify(json))
      localStorage.setItem('taxonomy-etag', res.headers.get('ETag')!)
      return json
    },
    { revalidateOnFocus: false }
  )
  return { taxonomy: data?.data, version: data?.version, isLoading, error }
}

      </RadioGroup>
      <Select value={specialty} onChange={setSpecialty} options={...} />

    </>
  )
